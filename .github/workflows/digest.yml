name: digest

# SUNSET (2026-07-28): flat found — no scheduled digests anymore. Manual runs still
# possible from the Actions tab. Restore the cron to reactivate:
#   was:  schedule: [cron: "23 6,16 * * *"]   # 08:23 / 18:23 Prague
on:
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: send digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run.py digest
