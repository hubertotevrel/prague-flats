name: pipeline

# The hands-off loop: crawl all sources, score, send instant alerts, and commit the
# updated SQLite back to the repo (the "git scraping" state). Scheduled hourly across
# the waking window because GitHub throttles scheduled workflows heavily (observed:
# only 2–3 of 6 daily crons actually ran, often hours late) — an hourly schedule
# yields roughly the intended every-2h cadence in practice. notify self-guards quiet
# hours (21:00–08:00 Prague), so a late-night run never pings regardless of DST.
on:
  schedule:
    # :17 past the hour, not :00 — GitHub drops cron jobs scheduled at the top of the
    # hour under peak load. Hourly, ~07:00–21:00 Prague (05:00–19:00 UTC in summer).
    - cron: "17 5-19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline          # never let two runs commit state at once
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: ingest -> score -> notify -> map
        env:
          MAPY_API_KEY: ${{ secrets.MAPY_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python run.py ingest --pages 12
          python run.py score
          python run.py notify
          python run.py map

      - name: commit state
        run: |
          git config user.name "flat-hunt-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/flats.db docs/index.html
          git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "no state change"; exit 0; }
          git pull --rebase --autostash
          git push
