name: pipeline

# SUNSET (2026-07-28): flat found — the hunt is over. The schedule trigger has been
# removed so no crawls, API calls or Telegram messages happen automatically anymore.
# The pipeline can still be run manually from the Actions tab (workflow_dispatch) if
# the hunt ever needs reviving; restore the cron below to fully reactivate it.
#   was:  schedule: [cron: "17 5-19 * * *"]   # hourly, ~07:00–21:00 Prague
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline          # never let two runs commit state at once
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: ingest -> score -> notify -> map
        env:
          MAPY_API_KEY: ${{ secrets.MAPY_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python run.py ingest --pages 12
          python run.py score
          python run.py notify
          python run.py map

      - name: commit state
        run: |
          git config user.name "flat-hunt-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/flats.db docs/index.html
          git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "no state change"; exit 0; }
          git pull --rebase --autostash
          git push
